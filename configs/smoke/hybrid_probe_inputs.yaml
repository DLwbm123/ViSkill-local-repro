envs:
  - name: FrozenLake # registered env name
    n_envs: 16
    data_source: frozenlake # nickname for logging
    seed_list: [1, 2, 3, 4, 5, 6, 7, 8, 101, 102, 103, 104, 105, 106, 107, 108, 0] # 101..108 encode sampled requests for the same actual seeds1..8
    max_turns: 1 # max number of interaction turns per episode
    response_length_per_turn: 512 # max response length per turn
    config: # env-specific config
      render_mode: vision
      size: 4
      p: 0.8
      is_slippery: false
      slip_prob: 0.0
      max_actions_per_step: 5
      prompt_format: free_think
